# WordPress Multisite
server {
    listen 443 ssl;
    server_name multisite.local *.multisite.local;

    ssl_certificate     /etc/nginx/ssl/multisite.local.pem;
    ssl_certificate_key /etc/nginx/ssl/multisite.local-key.pem;

    location / {
        proxy_pass http://multisite-nginx:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

