events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 ipv4=on;

    sendfile on;

    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # Load all project-specific virtual host configurations
    # from the conf.d directory.

    
    # include /etc/nginx/conf.d/sandbox.conf;
    # include /etc/nginx/conf.d/multisite.conf;

    include /etc/nginx/conf.d/mylocalwild.conf;
    include /etc/nginx/conf.d/dan.conf;
    
    # include /etc/nginx/conf.d/myjdwforms.conf;
    # include /etc/nginx/conf.d/jdw-onboarding.conf;

}