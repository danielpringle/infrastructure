services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      
    environment:
      DOMAIN: ${DOMAIN}

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - wordpress

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@demo.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WordPress Development}
    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
    networks:
      - wordpress

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    # Persist database data independently of the MySQL container.
    volumes:
      - dbdata:/var/lib/mysql

    # Prevent dependent services from starting before MySQL is ready.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$DB_ROOT_PASSWORD"
        ]
      timeout: 20s
      retries: 10
    networks:
      - wordpress

  wp:
    build:
      context: .
      dockerfile: docker/wp-cli/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_USER: ${DB_USER}
    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - wordpress

  phpmyadmin:
    image: phpmyadmin:latest

    # Development-only database administration UI.
    ports:
      - "8180:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wordpress

  mailpit:
    image: axllent/mailpit:latest

    # Development-only SMTP server and web interface.
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wordpress

volumes:
  dbdata:

networks:
  wordpress:
    driver: bridge