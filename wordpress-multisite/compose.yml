services:
  nginx:
    container_name: ${PROJECT_NAME}-nginx

    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    environment:
      DOMAIN: ${DOMAIN}

    # Nginx is accessed through the shared local reverse proxy.
    # It no longer binds directly to the host's HTTP/HTTPS ports.
    volumes:
      - ./app:/var/www/html

    depends_on:
      php:
        condition: service_started

    networks:
      - wordpress
      - proxy

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@demo.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-WordPress Development}
    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
    networks:
      - wordpress

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    # Persist database data independently of the MySQL container.
    volumes:
      - dbdata:/var/lib/mysql

    # Prevent dependent services from starting before MySQL is ready.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$DB_ROOT_PASSWORD"
        ]
      timeout: 20s
      retries: 10
    networks:
      - wordpress

  wp:
    build:
      context: .
      dockerfile: docker/wp-cli/Dockerfile

    command: tail -f /dev/null

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_USER: ${DB_USER}

    volumes:
      - ./app:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini

    networks:
      - wordpress

  phpmyadmin:
    
    container_name: ${PROJECT_NAME}-phpmyadmin

    image: phpmyadmin:latest

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wordpress
      - proxy

  mailpit:

    container_name: ${PROJECT_NAME}-mailpit
    
    image: axllent/mailpit:latest
    networks:
      - wordpress
      - proxy

volumes:
  dbdata:

networks:
  wordpress:
    driver: bridge

  # Shared with the central local reverse proxy.
  # Only Nginx joins this network; the other project services remain isolated.
  proxy:
    external: true
    name: dpuk-proxy