; Increase limits for local WordPress development.
; Production values should be defined separately.
memory_limit = 512M
max_execution_time = 120
max_input_vars = 3000

; Allow larger uploads for local development.
upload_max_filesize = 64M
post_max_size = 64M

; Display PHP errors during development.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Log errors rather than writing them to the response.
log_errors = On

; OPcache improves performance while still allowing code changes
; to be picked up during local development.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0