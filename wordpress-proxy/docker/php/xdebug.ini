; Xdebug is enabled for local development only.
zend_extension=xdebug

; Enable debugging and development helpers.
xdebug.mode=develop,debug

; Allow the container to connect back to the host IDE.
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; Start debugging when the IDE sends the appropriate trigger.
xdebug.start_with_request=trigger

; Keep debugging output out of normal application responses.
xdebug.log_level=0